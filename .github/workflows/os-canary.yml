# The non-Linux canary for the stdlib-only claim.
#
# `core` in ci.yml proves install/lint/test/demo on Linux for every supported
# Python. These two runners prove the same thing is true off Linux — the claim
# is about the package, not about Ubuntu.
#
# They run here, nightly, rather than in ci.yml on every push and pull request,
# because CI-CD-STANDARD.md §11b forbids macOS (10× minutes) and Windows (2×)
# on per-push CI and puts platform coverage on a schedule instead. Nothing in
# these steps exercises OS-specific device I/O; they re-run the same portable
# suite a third and fourth time, which is a canary's job and not a merge gate's.
# A regression here is a real regression — it just does not need to be found
# within four minutes of a push to be found within a day.
name: OS canary

on:
  schedule:
    # 04:23 UTC daily. Off-the-hour to avoid the scheduler rush, and clear of
    # the Monday 06:17/06:23 weekly jobs and the 12:17 live-integrity run.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-os:
    name: core, ${{ matrix.label }} (install, lint, test — auditor unreachable)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # `python`, not `python3`: setup-python puts `python` on PATH on every
      # platform, and `python3` does not exist on the Windows runner.
      - name: Test
        run: python -m unittest discover -s tests

      - name: The demo path runs with no install at all
        run: |
          python -m cairn index
          python -m cairn ask "How much is the monthly grocery allowance for one person?"
          python -m cairn ask --explain "What vaccinations does my dog need?"

      # Bash explicitly: the default shell for a `run:` step is PowerShell on
      # Windows and this step's syntax (`[ -d ... ]`, `grep`) is POSIX. Every
      # GitHub-hosted Windows runner ships Git Bash for exactly this.
      - name: Nothing above resolved the auditor
        shell: bash
        run: |
          if [ -d .plumbline-cache ]; then
            echo "the core path fetched the auditor; it must not need it" >&2
            exit 1
          fi
          if grep -rnE "^\s*(import|from)\s+plumbline\b" --include="*.py" cairn/; then
            echo "the engine imports the auditor; it must not" >&2
            exit 1
          fi
