# Security scanning, kept out of ci.yml on purpose.
#
# ci.yml's `core` job is the path a contributor runs, and its argument is that
# it needs nothing from outside this repository. These jobs need the opposite:
# a scanner fetched from somewhere, and in gitleaks' case the full history. So
# they live here, where a slow or unavailable scanner cannot make the
# contributor path look broken.
#
# All three run automatically on push and pull request. A scanner wired to
# workflow_dispatch only is a scanner nobody runs: the badge says the gate
# exists and the log nobody opens says it last ran in March. There is also a
# weekly schedule, because a new advisory against an unchanged tree is a fact
# about the world that no commit will surface.
#
# No `continue-on-error`, and no `|| true`. The same argument ci.yml makes
# about the audit job applies here: a check that could not run is not a check
# that passed, and the honest report of that is a red one.
#
# Every action is pinned to a commit rather than a tag, because a tag can be
# moved and a green run today that quietly means something else tomorrow is not
# a record of anything. The one scanner that is a downloaded binary rather than
# an action is pinned to an exact release and checked against the checksum file
# published beside it, which is the same argument in the form that artifact
# allows.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# CI-CD-STANDARD.md 11c: cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secret-scan:
    name: secret-scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A secret is committed once and removed in the next commit; a
          # shallow clone is exactly the scan that would miss it. Necessary,
          # and on its own not sufficient: this decides how much history is put
          # on disk, and the step below decides how much of it is read.
          fetch-depth: 0
          persist-credentials: false
      # Until 2026-09-13 this step was `gitleaks/gitleaks-action`, which picks
      # its range from the triggering event rather than scanning what is on
      # disk. On a push carrying one commit -- which is every squash merge into
      # `main` -- it runs `gitleaks detect --log-opts=-1`, exactly one commit;
      # on a pull request it reads the pull request's own commits. Only the
      # weekly `schedule` above dropped `--log-opts` and walked all 157. So a
      # job displaying the words "full history" read the full history once a
      # week and a diff on every other event, and the `fetch-depth: 0` above
      # never changed that: it governs what is fetched, not what is read.
      #
      # The pinned binary below is invoked as `gitleaks git .` with no
      # `--log-opts`. Given no range, gitleaks runs
      # `git log -p -U0 --full-history --all`, so it reads every commit on
      # every ref the checkout put on disk -- a superset of `main` -- and what
      # it reads no longer depends on how the run was triggered. Measured on
      # the first run of this step: 213 commits scanned, against the one commit
      # the old invocation read on a squash merge.
      # `tests/test_secret_scan_reads_history.py` holds that invocation, and
      # reads this file with its comments stripped so the names it forbids
      # cannot be satisfied by this paragraph.
      - name: gitleaks over the whole history, no range
        run: |
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          # `--retry` because the first run of this step lost the connection
          # mid-download (curl exit 35) and turned the gate red without ever
          # reaching a commit. Retrying a fetch is not the same as tolerating a
          # failure: `-f` and `set -e` still stand, so a download that does not
          # succeed after four attempts stops the job. The scan itself is never
          # retried and never softened.
          RETRY="--retry 3 --retry-all-errors --retry-delay 2"
          # shellcheck disable=SC2086
          curl -sSfL ${RETRY} -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          # shellcheck disable=SC2086
          curl -sSfL ${RETRY} -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # .plumbline-cache is not scanned even when a previous job has left one
      # behind: it is somebody else's code at a pinned commit, and scanning a
      # dependency here would report findings this repository cannot fix.
      - name: Semgrep
        run: pipx run semgrep==1.168.0 scan --error --metrics off --config p/python --config p/security-audit cairn tests *.py

  dependency-audit:
    name: dependency-audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: 'pip'
          python-version: "3.12"
      # The runtime has no dependencies at all, so what this audits is the
      # development toolchain. That is not a formality: a compromised linter
      # runs on every contributor's checkout.
      - name: pip-audit the development toolchain
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"
          pipx run pip-audit --strict
