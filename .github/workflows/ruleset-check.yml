# Checks whether .github/rulesets/main.json is actually enforced on this
# repository — a fact GitHub's own settings page shows, but nothing here
# re-checked over time until this workflow existed.
#
# The gap this closes: the ruleset being unapplied is documented in prose
# (README.md, DESIGN.md, .github/rulesets/README.md), and prose does not
# notice when the world stops matching it. If the ruleset were ever applied
# and then silently removed — a misclick, a repo transfer, a settings reset
# — nothing would say so. This job asks GitHub directly, on a schedule, and
# keeps one tracking issue open for as long as the answer is "not applied".
#
# What this job does NOT do: apply the ruleset. Whether a check can block a
# merge is a repository setting only someone with admin rights can change
# (.github/rulesets/README.md), and a workflow quietly seizing that decision
# would be the opposite of the point — it reports, it never enforces.
#
# ---------------------------------------------------------------------------
# What it used to ask, and why that was not enough
# ---------------------------------------------------------------------------
# The check was a count:
#
#   [.[] | select(.enforcement == "active")] | length
#
# One active ruleset, anywhere on the repository, of any content, satisfied
# it. So "applied" meant "something is applied" — not that the ten required
# contexts are required, not that `main` is the branch it targets, and not
# that the bypass list is empty. tests/test_rulesets.py checks all of that
# against the committed FILE; this job checked that a ruleset EXISTED; and
# the step joining them — that the live ruleset is the committed one — was
# checked by nothing at either end.
#
# That gap was live. On 2026-08-28 the enforced ruleset carried a
# RepositoryRole bypass actor with bypass_mode "always", while
# .github/rulesets/main.json carries `"bypass_actors": []` and
# .github/rulesets/README.md argues that emptiness by name. Nothing was red:
# `test_nobody_can_bypass_it` read the file, and the file was right.
#
# So the count is now a comparison, in ruleset_conformance.py — a module
# rather than more `jq`, so the judgement is testable offline against
# fixtures including that exact drift, and so the thing that fetches and the
# thing that judges stay separable (the same split plumbline-gate.sh and
# audit_guard.py already use).
#
# And the job FAILS on drift, after updating the tracking issue. That is not
# a change of stance — it still never applies anything — it is the stance
# this repository takes everywhere else about reports: a green scheduled run
# next to an open issue is the "warning in a log nobody opens" that ci.yml's
# own header refuses.
#
# ---------------------------------------------------------------------------
# The alarm that fired without a fire
# ---------------------------------------------------------------------------
# Issue #80, opened by this job on 2026-08-31, said the repository owner's
# standing bypass was NOT enforced. It was. Ruleset 21223426 had carried it
# since 2026-08-26 and had not been edited since; read with credentials that
# can administer the repository, that same ruleset conforms exactly.
#
# GitHub omits `bypass_actors` from a ruleset payload when the caller may not
# administer the repository, and `github.token` may not. `ruleset_conformance.py`
# read the omission through `.get(...) or []`, so an unreadable field and an
# emptied one produced the same sentence — and the sentence was the lockout
# incident's.
#
# It is the worst false positive this job could have. The remedy its issue
# body names is "reapply the committed ruleset", and reapplying is precisely
# how an owner gets locked out; and once the alarm has fired without a fire,
# the one finding this job exists for cannot be told apart from the noise.
#
# So there are three outcomes now, and the not-judged one is routed away from
# the tracking issue entirely: it fails the run, with its own message, telling
# whoever reads it to look at the token and change nothing about the ruleset.
# The job still never applies anything, and now it never reports anything it
# could not see.

name: ruleset-check

on:
  schedule:
    - cron: "23 6 * * 1" # weekly, offset from security.yml's Monday run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check ruleset is applied
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check that the enforced ruleset is the committed one
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The list endpoint does not expand `rules` or `bypass_actors`, so
          # each ruleset is fetched by id. A comparison against a summary
          # would be a comparison of the fields that happen to be summarised,
          # which is how the previous version of this step ended up counting.
          #
          # No `|| true` on the API calls. "The question could not be asked"
          # and "the answer is no rulesets" are different facts, and writing
          # an empty list on a failed request would turn the first into the
          # second — an unreachable API reported as an unprotected branch, or
          # worse, a partial list reported as the whole one. `set -e` makes a
          # failed call end the job, which is the honest report of not knowing.
          gh api "repos/${REPO}/rulesets" --jq '.[].id' > ids.txt
          {
            echo "["
            first=1
            while read -r id; do
              [ -n "$id" ] || continue
              [ "$first" -eq 1 ] || echo ","
              first=0
              gh api "repos/${REPO}/rulesets/${id}"
            done < ids.txt
            echo "]"
          } > live.json

          # Deliberately not `python3 ... | tee findings.txt`: `$?` after a
          # pipeline is the LAST command's status, so that reads tee's, which
          # is 0 whatever the comparison found. A gate whose exit code is
          # swallowed by a pipe is exactly the failure this file is about.
          set +e
          python3 ruleset_conformance.py --live live.json > findings.txt 2>&1
          code=$?
          set -e
          cat findings.txt
          echo "conformance exited ${code}"
          # Three outcomes, not two. Exit 4 is "this payload cannot answer the
          # question" -- GitHub omits `bypass_actors` from a ruleset the caller
          # may not administer, and `github.token` normally cannot. Folding
          # that into `applied=false` is what opened issue #80 against a
          # ruleset that was correct and untouched, with a body telling a
          # reader to reapply the committed file. Reapplying is how the owner
          # gets locked out, so the not-judged case must never reach the step
          # that writes that sentence.
          case "$code" in
            0) echo "applied=true"  >> "$GITHUB_OUTPUT"
               echo "judged=true"   >> "$GITHUB_OUTPUT" ;;
            4) echo "applied=false" >> "$GITHUB_OUTPUT"
               echo "judged=false"  >> "$GITHUB_OUTPUT" ;;
            *) echo "applied=false" >> "$GITHUB_OUTPUT"
               echo "judged=true"   >> "$GITHUB_OUTPUT" ;;
          esac
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.check.outputs.applied == 'false' && steps.check.outputs.judged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="Branch protection ruleset is not enforced"
          CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FINDINGS=$(cat findings.txt 2>/dev/null || echo "(no findings written)")
          BODY="The ruleset GitHub is enforcing is not the one committed at \
          .github/rulesets/main.json (checked ${CHECKED_AT}).

          \`\`\`
          ${FINDINGS}
          \`\`\`

          See .github/rulesets/README.md for the two ways to reapply it, both \
          of which need admin rights on the repository. Reapplying is delete \
          then POST: a \`required_status_checks\` list is replaced as a whole, \
          never merged field by field.

          This issue is opened and updated automatically by \
          \`.github/workflows/ruleset-check.yml\` on a weekly schedule. It \
          does not apply the ruleset itself, only reports the difference, and \
          it will close itself automatically once the enforced ruleset matches \
          the committed one."

          existing=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"${TITLE}\"" --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$BODY"
          fi

      - name: Close the tracking issue if the ruleset is now applied
        if: steps.check.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="Branch protection ruleset is not enforced"
          CHECKED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"${TITLE}\"" --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body \
              "The enforced ruleset now matches .github/rulesets/main.json (checked ${CHECKED_AT}). Closing automatically."
            gh issue close "$existing" --repo "$REPO"
          fi

      # After the issue, not instead of it. A scheduled workflow that stays
      # green while it files a report is the shape ci.yml's header rejects:
      # the check ran, it found something, and the run summary said nothing.
      - name: Fail the run while the enforced ruleset is not the committed one
        if: steps.check.outputs.applied == 'false' && steps.check.outputs.judged == 'true'
        run: |
          cat findings.txt 2>/dev/null || true
          echo "the enforced ruleset does not match .github/rulesets/main.json" >&2
          exit 1

      # Red, like the step above, and for the same reason: a check that could
      # not run is not a check that passed. Deliberately a *different* step
      # with a different message and no tracking issue behind it, because the
      # action a reader should take is the opposite one. "Drifted" means look
      # at the repository settings. "Could not run" means look at the token,
      # and change nothing about the ruleset until someone who can read
      # `bypass_actors` has looked.
      - name: Fail the run when the ruleset could not be judged at all
        if: steps.check.outputs.judged == 'false'
        run: |
          cat findings.txt 2>/dev/null || true
          echo "the enforced ruleset could not be compared: the payload this" >&2
          echo "job could read does not carry the fields the comparison needs." >&2
          echo "Do not reapply .github/rulesets/main.json on the strength of" >&2
          echo "this run. Read the ruleset with admin credentials first:" >&2
          echo "  gh api repos/${{ github.repository }}/rulesets" >&2
          exit 1
