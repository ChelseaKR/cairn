[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-assistant"
version = "0.3.0"
description = "Retrieval-grounded question answering for public agencies: answers only from an operator-supplied corpus, cites its sources, refuses cleanly when it has none."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chelsea Kelly-Reif" }]
keywords = ["retrieval", "grounded", "question-answering", "public-sector", "citations"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
# Deliberately empty: the runtime is standard-library only so the demo path
# works offline from a clean checkout (see DESIGN.md, "Core stance").
dependencies = []

# The runtime stays empty. These are the development toolchain, floored rather
# than left open: an unpinned linter is a gate whose rules change under you, and
# "ruff passed" stops meaning anything specific.
[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.15",
  "mypy>=1.18",
  "coverage>=7.6",
]

# Separate from `dev`: contributors running the test suite have no use for a
# build frontend, and .github/workflows/release.yml's pypi job — the only
# thing that installs this extra — has no use for pytest or mypy.
release = [
  "build>=1.2",
]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools]
packages = ["cairn", "cairn.ui"]

[tool.setuptools.package-data]
"cairn.ui" = ["static/*.css", "static/*.js"]

[tool.ruff]
line-length = 96
target-version = "py311"
# The auditor is resolved into this directory at run time. It is somebody
# else's code at a pinned commit; linting it here would be linting a
# dependency.
extend-exclude = [".plumbline-cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

# `C90` is enforced, as of 2026-08-27. It was configured and left out of
# `select` for most of this repository's history, because functions were over
# the limit and the honest handling of that was to say so rather than to
# switch the rule off quietly.
#
# The count went eight (published) / twelve (actual) / five / zero in one day.
# The gap between the first two is the part worth remembering: the list was
# kept by hand in this comment, one function and one number at a time, and the
# pilot tooling added four that nobody recompiled it for. `tests/test_code_quality.py`
# held the corrected count to ruff after that, and now holds the emptiness:
# the rule being in `select` means a thirteenth function fails the lint step
# rather than joining a list.
#
# What it took: twelve refactors, every one an extraction rather than a
# collapse, and none of them a behaviour change. `audit_guard.py`'s terminal
# report, the `_ParagraphExtractor` over all 132 pages in `source_pages/`, and
# 480 multi-turn session sequences were each compared byte-for-byte against
# the pre-refactor code. See docs/roadmap.md phases 3 and 4.
[tool.ruff.lint.mccabe]
max-complexity = 10

# Strict, as of 2026-08-27. It was not, and the reason it was not was
# arithmetic rather than principle: strict mode reported 44 findings on this
# tree, and silencing them to claim a level the repository had not reached
# would have been the opposite of what the rest of it argues for. The
# findings were closed instead (issues #34-#37, all mechanical — a missing
# return type, a bare `dict` needing type arguments, one import taken through
# a module that does not re-export it), so the reason expired.
#
# Running the check is the point, not reaching zero once. A tree that reports
# zero with the check switched off reports one on the next pull request and
# nothing says so. There are no per-module overrides and there is no
# `ignore_errors` anywhere, which `tests/test_code_quality.py` holds: a
# strict gate with an excused module is a strict-looking gate.
#
# `files` is `cairn` only. The top-level scripts (audit_guard.py,
# import_corpus.py, the pilot tooling) are dev tooling and have never been in
# scope here; widening it is its own decision with its own findings.
[tool.mypy]
python_version = "3.12"
files = ["cairn"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["cairn"]

[tool.coverage.report]
# The floor is a minimum, not the measurement. Measured 89% branch coverage on
# 2026-08-17, 92% on 2026-08-22 after six features landed in one session
# (WORKLOG.md sessions 11-16); the floor sits below whichever is current so a
# real regression trips the gate without a routine refactor tripping it for
# no reason.
fail_under = 85
show_missing = true
