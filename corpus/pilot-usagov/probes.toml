# Calibration probes for the real-corpus pilot (corpus/pilot-usagov/),
# written the same shape as docs/calibration-probes.example.toml — real
# questions a person reading these six real usa.gov pages would ask, plus
# plausible off-topic refusals. See docs/pilot-usagov.md for what running
# `cairn calibrate --probes corpus/pilot-usagov/probes.toml` against this
# file found.
#
# The probe blocks below this header are GENERATED. They are what
# `python3 probes_from_questions.py corpus/pilot-usagov/questions.toml
# -o corpus/pilot-usagov/probes.toml` writes, so the question set is
# the one place a question lives; edit questions.toml and re-run
# rather than editing here. Only this comment block is authored;
# tests/test_probes_from_questions.py compares the generated part
# byte for byte.

