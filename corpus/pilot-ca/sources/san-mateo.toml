# San Mateo County layer. Chosen on 2026-08-23 after a survey of all 58
# counties' website terms (docs/pilot-ca.md, Finding 0): one of four whose
# terms carry the state's public-domain sentence, the largest of them
# (~750,000 people, Bay Area, Spanish / Chinese / Tagalog), and the one whose
# Human Services Agency site answers this pilot's user agent directly.
#
# Terms, read 2026-08-23, https://www.smcgov.org/endorsement-disclaimers,
# "Ownership": "In general, information presented on this web site is
# considered in the public domain. It may be distributed or copied as
# permitted by law. However, the County of San Mateo does make some use of
# copyrighted data such as photographs which may require additional
# permissions prior to your use." The footer's "All rights reserved" sits
# under that sentence, which governs; the review step checks each page for
# an "otherwise indicated" marking all the same.
#
# Every URL answered 200 on 2026-08-23. Elections, assessor and clerk-
# recorder live on smcacre.org, a separate domain with its own terms, not
# read — left out. No Spanish edition of the HSA pages was found at the
# paths tried. Draft: 16 pages; target ~25.

layer = "san-mateo"
terms = "https://www.smcgov.org/endorsement-disclaimers"
terms_checked = "2026-08-23"
terms_note = "public domain in general (county disclaimers page, 'Ownership')"

