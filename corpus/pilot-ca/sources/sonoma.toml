# Sonoma County layer. Chosen on 2026-08-23 after the 58-county terms survey
# (docs/pilot-ca.md, Finding 0): one of four counties whose terms carry the
# state's public-domain sentence; ~490,000 people, North Bay, with a large
# Spanish-speaking population — the Spanish-contrast county the original
# scope wanted from the Central Valley, whose counties either forbid reuse
# or refuse automated reading.
#
# Terms, read 2026-08-23, https://sonomacounty.gov/terms-of-use,
# "Ownership": "In general, information presented on this web site, unless
# otherwise indicated, is considered in the public domain. It may be
# distributed or copied as permitted by law. However, the County does make
# use of copyrighted data (e.g., photographs) which may require additional
# permissions prior to your use."
#
# The county moved from sonomacounty.ca.gov to sonomacounty.gov; every URL
# below answered 200 on the new host on 2026-08-23. The Spanish path tried
# (/es/...) was 404; the site has a language selector that may serve Spanish
# another way — to be found. Draft: 17 pages; target ~25.

layer = "sonoma"
terms = "https://sonomacounty.gov/terms-of-use"
terms_checked = "2026-08-23"
terms_note = "public domain unless otherwise indicated (county terms of use, 'Ownership')"

