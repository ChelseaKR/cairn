# Siskiyou County layer — the rural county. Kept after the 58-county terms
# survey (docs/pilot-ca.md, Finding 0): its terms, once readable with a
# browser user agent, carry the state's public-domain sentence.
#
# Terms, read 2026-08-23, https://www.siskiyoucounty.gov/ru/page/website-terms-use
# (the path the site's language router served; the text is English), "D.
# Third Party Information": "In general, information presented on this
# website, unless otherwise indicated, is considered in the public domain.
# It may be distributed or copied as permitted by law. However, the County
# does make use of copyrighted data (e.g., photographs), which may require
# additional permissions prior to your use."
#
# The host closes every connection from this script (HTTP/2
# ENHANCE_YOUR_CALM), so every page here is saved from a browser under the
# `file` name and registered with `fetch_pages.py ... --hand-saved` —
# `browser_save.mjs` does that with a headless Chromium, which this host
# accepts. The paths below were read from the saved homepage's own links on
# 2026-08-23; the site is Drupal with a language router, so the terms page
# lives under /ru/ (its text is English).

layer = "siskiyou"
terms = "https://www.siskiyoucounty.gov/ru/page/website-terms-use"
terms_checked = "2026-08-23"
terms_note = "public domain unless otherwise indicated (county website terms of use, D); host refuses scripts — hand-save"

