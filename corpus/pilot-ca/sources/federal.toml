# Federal layer: the program owners' own pages, not usa.gov's umbrella pages.
# docs/pilot-usagov.md found that usa.gov overview pages carry no dollar
# amounts; the agencies that run the programs publish the numbers.
#
# Works of the U.S. federal government are not subject to copyright
# (17 U.S.C. §105). Individual sites may mark third-party content; the review
# step checks for that. `terms` below is the cross-government statement of
# the rule; `terms_checked` is the day a person read it for this pilot.
#
# Every URL below answered 200 to this pilot's user agent on 2026-08-23
# unless a comment says otherwise. ssa.gov and fcc.gov answer 403 to every
# non-browser client; studentaid.gov drops this script's user agent. Those
# pages are saved from a browser under the `file` name given and registered
# with `fetch_pages.py ... --hand-saved`.
#
# Draft of 2026-08-23: 41 pages. Target for the pilot is ~130; the rest are
# added the same way — verify, list, fetch, review.

layer = "federal"
terms = "https://www.usa.gov/government-copyright"
terms_checked = "2026-08-23"
terms_note = "U.S. government works are not subject to copyright, 17 U.S.C. §105"

