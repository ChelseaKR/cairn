# California state layer: the state agencies that administer the programs the
# federal layer describes (CalFresh for SNAP, Medi-Cal for Medicaid, CalWORKs
# for TANF, CalEITC beside the federal EITC), plus the state-only sites with
# the heaviest real question traffic (DMV, EDD, Covered California, the
# courts' self-help centre, the Secretary of State's voter pages).
#
# Terms: https://www.ca.gov/use/ — "In general, information presented on this
# website, unless otherwise indicated, is considered in the public domain. It
# may be distributed or copied as permitted by law." Read 2026-08-23. CDSS's
# own conditions-of-use page (cdss.ca.gov/conditions-of-use) carries the same
# sentence. The other agencies below are state sites under the same policy;
# the review step checks each page for an "otherwise indicated" marking.
#
# Every URL answered 200 or a same-site 301 to this pilot's user agent on
# 2026-08-23. Guessed URLs that did not (DMV fee page, EDD benefit-amount
# calculator, FTB payment plans, CSAC, CSD/LIHEAP — the state LIHEAP page
# answered 401) are left out until someone finds the current address.
#
# Draft of 2026-08-23: 32 pages. Target is ~170. The CalFresh income-limit
# table, the Medi-Cal income chart and the DMV fee schedule are the first
# things to add — they are the numbers the federal layer does not have.

layer = "california"
terms = "https://www.ca.gov/use/"
terms_checked = "2026-08-23"
terms_note = "state content public domain unless otherwise indicated (ca.gov conditions of use)"

